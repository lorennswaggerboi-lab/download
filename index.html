<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archivos compartidos</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1e27;--mu:#6b7280;--ac:#5b5bd6;--bd:#e3e5ee}
@media (prefers-color-scheme:dark){:root{--bg:#14151a;--card:#1e2028;--tx:#eceef5;--mu:#9aa0b2;--ac:#8b8bf0;--bd:#2d303b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
main{max-width:680px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:8px 0 4px}
.sub{color:var(--mu);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
textarea{width:100%;border:1px solid var(--bd);border-radius:10px;padding:10px;background:transparent;color:var(--tx);font:inherit;resize:vertical;min-height:60px;margin-top:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 14px;font:inherit;cursor:pointer}
button.ghost{background:transparent;color:var(--mu);border:1px solid var(--bd)}
button:disabled{opacity:.5;cursor:default}
.drop{border:2px dashed var(--bd);border-radius:12px;padding:18px;text-align:center;color:var(--mu);cursor:pointer}
.drop.on{border-color:var(--ac);color:var(--ac)}
.meta{color:var(--mu);font-size:.85rem}
.file{display:flex;gap:10px;align-items:center;margin-top:10px;padding:10px;border:1px solid var(--bd);border-radius:10px}
.ico{font-size:1.6rem}
.fn{font-weight:600;word-break:break-all}
.grow{flex:1;min-width:0}
.prev{max-width:100%;max-height:360px;border-radius:10px;display:block;margin-top:10px}
.msg{color:var(--mu);text-align:center;padding:24px}
.err{color:#d33;font-size:.9rem;margin-top:8px}
</style>
</head>
<body>
<main>
  <h1>📁 Archivos compartidos</h1>
  <p class="sub">Subí un archivo y aparece como publicación. Cualquiera puede descargarlo.</p>

  <section class="card">
    <div class="drop" id="drop">Tocá acá o arrastrá un archivo<br><span class="meta">Cualquier tipo · hasta 20 MB</span></div>
    <input type="file" id="pick" hidden>
    <div id="sel" class="file" hidden><span class="ico" id="selI"></span><div class="grow"><div class="fn" id="selN"></div><div class="meta" id="selS"></div></div><button class="ghost" id="clr">Quitar</button></div>
    <textarea id="cap" placeholder="Escribí algo sobre el archivo (opcional)"></textarea>
    <div class="row"><button id="pub" disabled>Publicar</button><span class="meta" id="st"></span></div>
    <div class="err" id="err"></div>
  </section>

  <div id="feed"><div class="msg">Cargando…</div></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ====== CONFIGURACIÓN: pegá acá tus datos de Supabase ======
const SUPABASE_URL = "https://dtqyneohownxguliiitc.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR0cXluZW9ob3dueGd1bGlpaXRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNTc3NTgsImV4cCI6MjEwNzkzMzc1OH0.u6l7LBCiA_gUghkf5wl-FuR3yeSlIK_lnhqkUgw9tKQ";
// ===========================================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const BUCKET = "archivos", MAX = 20 * 1048576;
const $ = s => document.querySelector(s);
let file = null;

const fmt = b => b < 1024 ? b + " B" : b < 1048576 ? (b / 1024).toFixed(1) + " KB" : (b / 1048576).toFixed(1) + " MB";
const icon = t => !t ? "📄" : t.startsWith("image/") ? "🖼️" : t.startsWith("video/") ? "🎬" : t.startsWith("audio/") ? "🎵" : t === "application/pdf" ? "📕" : "📄";
const urlOf = path => sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;

async function load() {
  const { data, error } = await sb.from("posts").select("*").order("created_at", { ascending: false });
  const feed = $("#feed");
  if (error) { feed.innerHTML = '<div class="msg">No se pudieron cargar las publicaciones. Revisá la configuración de Supabase.</div>'; return; }
  if (!data.length) { feed.innerHTML = '<div class="msg">Todavía no hay publicaciones. ¡Subí la primera!</div>'; return; }
  feed.innerHTML = "";
  data.forEach(p => {
    const url = urlOf(p.path), t = p.type || "";
    const c = document.createElement("article"); c.className = "card";
    let prev = "";
    if (t.startsWith("image/")) prev = '<img class="prev" loading="lazy" alt="">';
    else if (t.startsWith("video/")) prev = '<video class="prev" controls preload="metadata"></video>';
    else if (t.startsWith("audio/")) prev = '<audio class="prev" controls preload="none" style="width:100%"></audio>';
    c.innerHTML = (p.caption ? "<div></div>" : "") + prev +
      '<div class="file"><span class="ico"></span><div class="grow"><div class="fn"></div><div class="meta"></div></div><button class="dl">Descargar</button></div><div class="err"></div><div class="meta" style="margin-top:8px"></div>';
    if (p.caption) c.firstChild.textContent = p.caption;
    const m = c.querySelector("img,video,audio"); if (m) m.src = url;
    c.querySelector(".ico").textContent = icon(t);
    c.querySelector(".fn").textContent = p.name;
    c.querySelector(".file .meta").textContent = fmt(p.size);
    c.lastElementChild.textContent = new Date(p.created_at).toLocaleString("es-AR", { dateStyle: "medium", timeStyle: "short" });
    const err = c.querySelector(".err");
    c.querySelector(".dl").onclick = async e => {
      const b = e.target; b.disabled = true; err.textContent = "";
      try {
        const blob = await (await fetch(url)).blob();
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob); a.download = p.name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      } catch (x) { err.textContent = "No se pudo descargar. Probá de nuevo."; }
      b.disabled = false;
    };
    feed.appendChild(c);
  });
}

function setFile(f) {
  $("#err").textContent = "";
  if (!f) { file = null; $("#sel").hidden = true; $("#pub").disabled = true; return; }
  if (f.size > MAX) { $("#err").textContent = "El archivo supera los 20 MB."; return; }
  file = f;
  $("#selI").textContent = icon(f.type); $("#selN").textContent = f.name; $("#selS").textContent = fmt(f.size);
  $("#sel").hidden = false; $("#pub").disabled = false;
}
$("#drop").onclick = () => $("#pick").click();
$("#pick").onchange = e => { setFile(e.target.files[0]); e.target.value = ""; };
$("#clr").onclick = () => setFile(null);
["dragover", "dragenter"].forEach(ev => $("#drop").addEventListener(ev, e => { e.preventDefault(); $("#drop").classList.add("on"); }));
["dragleave", "drop"].forEach(ev => $("#drop").addEventListener(ev, e => { e.preventDefault(); $("#drop").classList.remove("on"); }));
$("#drop").addEventListener("drop", e => setFile(e.dataTransfer.files[0]));

$("#pub").onclick = async () => {
  if (!file) return;
  $("#pub").disabled = true; $("#st").textContent = "Subiendo…"; $("#err").textContent = "";
  try {
    const safe = file.name.replace(/[^\w.\-]+/g, "_");
    const path = crypto.randomUUID() + "-" + safe;
    const up = await sb.storage.from(BUCKET).upload(path, file, { contentType: file.type || "application/octet-stream" });
    if (up.error) throw up.error;
    const ins = await sb.from("posts").insert({ name: file.name, path, size: file.size, type: file.type || null, caption: $("#cap").value.trim() || null });
    if (ins.error) throw ins.error;
    $("#cap").value = ""; setFile(null); $("#st").textContent = "";
    await load();
  } catch (e) {
    $("#err").textContent = "No se pudo publicar" + (e && e.message ? ": " + e.message : ".");
    $("#st").textContent = ""; $("#pub").disabled = false;
  }
};
load();
</script>
</body>
</html>
